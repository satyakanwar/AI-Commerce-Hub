apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector: {app: mongodb}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector: {app: product-service}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector: {app: order-service}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector: {app: ai-service}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector: {app: frontend}
  ports:
    - name: http
      port: 80
      targetPort: 80
