server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /api/products { proxy_pass http://product-service:8000/products; }
  location /api/products/ { rewrite ^/api/products(.*)$ /products$1 break; proxy_pass http://product-service:8000; }
  location = /api/orders { proxy_pass http://order-service:8000/orders; }
  location /api/orders/ { rewrite ^/api/orders(.*)$ /orders$1 break; proxy_pass http://order-service:8000; }
  location /api/ai/ { rewrite ^/api/ai(.*)$ $1 break; proxy_pass http://ai-service:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
